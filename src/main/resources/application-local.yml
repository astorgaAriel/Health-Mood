# Para desarrollo local (localhost, root, sin contraseña)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/health_mood}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  #Podemos desactivar Hibernate DDL auto y forzar que Spring use nuestro script SQL
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never   # o ALWAYS si quieres que cargue schema.sql en cada arranque

app:
  security:
    cors:
      dev: true  # Deshabilita CORS para Postman en desarrollo local
