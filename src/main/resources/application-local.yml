# Para desarrollo local (localhost, postgres, sin contraseña)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/health_mood}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none  # Deshabilitar completamente la generación automática
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always   # Usar solo nuestros scripts SQL
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql
      continue-on-error: false

# Configuración de logging para debug
logging:
  level:
    org.springframework.boot.autoconfigure: INFO
    org.springframework.boot.context: INFO
    org.springframework.security: WARN
    org.hibernate: INFO
    cl.healthmood: INFO

app:
  security:
    cors:
      dev: true  # Deshabilita CORS para Postman en desarrollo local
