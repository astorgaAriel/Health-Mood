spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/health_mood}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false

app:
  security:
    cors:
      dev: false
